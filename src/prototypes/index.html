<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viroqua Business Guide - Prototype</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@200;300;400;500&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Montserrat:wght@300;400;600&family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@400;700;900&family=Roboto+Mono:wght@400&family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <style>
        /* BASE RESET & UTILS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            transition: all 0.4s ease;
            min-height: 100vh;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* LAYOUT & CONTROLS */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border: 1px solid #e0e0e0;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
            position: relative;
        }

        /* VIEWS TRANSITION */
        .view-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .view-section.active {
            display: block;
            opacity: 1;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            margin-bottom: 5rem;
            text-align: center;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .card {
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .card-image {
            height: 240px;
            background-color: #eee;
            background-size: cover;
            background-position: center;
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* DETAIL VIEW STYLES */
        .detail-header {
            margin-bottom: 2rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            margin-bottom: 2rem;
            background: transparent;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: translateX(-5px);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
        }

        .detail-hero {
            height: 400px;
            width: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .info-box {
            padding: 2rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .info-row {
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 1rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 0.25rem;
        }

        .info-val {
            font-size: 1.1rem;
            font-weight: 500;
        }

        @media(max-width: 800px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =========================================
           1. DRIFTLESS EARTH (Nature-First)
           Palette: Forest Green, Trout Blue, Limestone Cream, Loam Brown
           ========================================= */
        [data-theme="driftless"] {
            --bg: #F0EAD6;
            /* Limestone Cream */
            --text: #5D4037;
            /* Loam Brown */
            --primary: #2C4C3B;
            /* Deep Forest Green */
            --accent: #4A6FA5;
            /* Trout Stream Blue */

            background-color: var(--bg);
            color: var(--text);
            font-family: 'Nunito', sans-serif;

            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' id='svg' viewBox='0 0 1440 490' xmlns='http://www.w3.org/2000/svg' class='transition duration-300 ease-in-out delay-150'%3E%3Cpath d='M 0,500 C 0,500 0,250 0,250 C 109.11004784688998,284.17224880382775 218.22009569377995,318.3444976076555 330,317 C 441.77990430622005,315.6555023923445 556.2296650717703,278.7942583732057 663,260 C 769.7703349282297,241.20574162679425 868.8612440191388,240.4784688995215 979,252 C 1089.1387559808612,263.5215311004785 1210.3253588516748,287.2918660287081 1313,293 C 1415.6746411483252,298.7081339712919 1499.8373205741626,286.3540669856459 1584,274 L 1584,500 L 0,500 Z' stroke='none' stroke-width='0' fill='%23E6DEC6' fill-opacity='1'%3E%3C/path%3E%3Cpath d='M 0,500 C 0,500 0,450 0,450 C 131.0622009569378,442.2775119617225 262.1244019138756,434.555023923445 352,434 C 441.8755980861244,433.444976076555 490.5645933014354,440.0574162679426 597,422 C 703.4354066985646,403.9425837320574 867.6172248803828,361.2153110047847 968,362 C 1068.3827751196172,362.7846889952153 1104.9665071770335,407.08133971291864 1211,424 C 1317.0334928229665,440.91866028708136 1492.5167464114832,430.45933014354066 1668,420 L 1668,500 L 0,500 Z' stroke='none' stroke-width='0' fill='%23DCD0B2' fill-opacity='1'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: bottom;
            background-size: cover;
            background-attachment: fixed;
        }

        [data-theme="driftless"] .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(44, 76, 59, 0.08);
            border: none;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        [data-theme="driftless"] .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(44, 76, 59, 0.15);
        }

        [data-theme="driftless"] h1 {
            color: var(--primary);
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        [data-theme="driftless"] .card-title {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        [data-theme="driftless"] .tag {
            background: var(--primary);
            color: #fff;
            border-radius: 50px;
            font-weight: 600;
        }

        [data-theme="driftless"] .tag:nth-child(even) {
            background: var(--accent);
        }

        [data-theme="driftless"] .back-btn {
            color: var(--text);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
        }

        [data-theme="driftless"] .detail-hero {
            border-radius: 24px;
        }

        [data-theme="driftless"] .info-box {
            border-radius: 24px;
            background: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(44, 76, 59, 0.05);
        }

        /* =========================================
           2. MAIN STREET VINTAGE (Historic)
           Palette: Brick Red, Sandstone, Charcoal, Antique Gold
           ========================================= */
        [data-theme="vintage"] {
            --bg: #F2EBD4;
            --card-bg: #F9F4E6;
            --text: #333333;
            --primary: #8B3A3A;
            --gold: #C5A059;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Lora', serif;
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
        }

        [data-theme="vintage"] .container {
            border: 4px double var(--primary);
            background: rgba(255, 255, 255, 0.7);
            margin-top: 2rem;
            margin-bottom: 2rem;
            max-width: 1200px;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.1);
        }

        [data-theme="vintage"] .card {
            background: var(--card-bg);
            border: 1px solid #D6C6B0;
            border-radius: 2px;
            box-shadow: none;
            position: relative;
        }

        [data-theme="vintage"] .card::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid var(--gold);
            pointer-events: none;
        }

        [data-theme="vintage"] h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            border-bottom: 3px double var(--primary);
            border-top: 3px double var(--primary);
            padding: 1rem 0;
            width: 100%;
        }

        [data-theme="vintage"] .card-title,
        [data-theme="vintage"] .detail-title {
            font-family: 'Playfair Display', serif;
            color: #111;
        }

        [data-theme="vintage"] .tag {
            border: 1px solid var(--text);
            color: var(--text);
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            border-radius: 0;
            background: transparent;
        }

        [data-theme="vintage"] .back-btn {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--primary);
            color: var(--primary);
        }

        [data-theme="vintage"] .detail-hero {
            border-radius: 2px;
            border: 4px solid var(--card-bg);
            outline: 1px solid #D6C6B0;
        }

        [data-theme="vintage"] .info-box {
            background: var(--card-bg);
            border: 1px solid #D6C6B0;
            border-radius: 0;
        }

        /* =========================================
           3. BOHEMIAN HARVEST (Artsy/Eclectic)
           Palette: Terracotta, Sage, Mustard, Lavender
           ========================================= */
        [data-theme="boho"] {
            --bg: #E3B505;
            --text: #2B2B2B;
            --primary: #E2725B;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            background-image: radial-gradient(#E2725B 15%, transparent 16%), radial-gradient(#E2725B 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        [data-theme="boho"] .card {
            background: #FFF0F5;
            border: 3px solid #000;
            box-shadow: 8px 8px 0 #000;
            border-radius: 12px;
            overflow: visible;
        }

        [data-theme="boho"] .card:hover {
            transform: translate(-4px, -4px) rotate(-1deg);
            box-shadow: 12px 12px 0 #000;
        }

        [data-theme="boho"] .card:nth-child(even) {
            background: #FFF;
        }

        [data-theme="boho"] .card:nth-child(3n) {
            transform: rotate(2deg);
        }

        [data-theme="boho"] h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 5rem;
            color: var(--primary);
            text-shadow: 4px 4px 0 #000;
            -webkit-text-stroke: 1.5px black;
            transform: rotate(-3deg);
            margin-bottom: 2rem;
            background: #fff;
            padding: 1rem;
            border: 3px solid #000;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.8);
            display: inline-block;
        }

        [data-theme="boho"] .card-image {
            border-bottom: 3px solid #000;
            filter: contrast(110%) saturate(120%);
        }

        [data-theme="boho"] .tag {
            background: #000;
            color: #fff;
            border: none;
            font-weight: 700;
            border-radius: 4px;
            transform: rotate(-2deg);
            padding: 0.4rem 0.8rem;
        }

        [data-theme="boho"] .tag:nth-child(even) {
            background: var(--primary);
            color: #000;
            border: 2px solid #000;
            transform: rotate(2deg);
        }

        [data-theme="boho"] .back-btn {
            background: #000;
            color: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            box-shadow: 4px 4px 0 #fff;
        }

        [data-theme="boho"] .detail-hero {
            border: 3px solid #000;
            box-shadow: 10px 10px 0 #000;
            border-radius: 0;
        }

        [data-theme="boho"] .info-box {
            background: #fff;
            border: 3px solid #000;
            box-shadow: 8px 8px 0 #000;
            border-radius: 12px;
        }

        /* =========================================
           4. NORDIC MINIMALIST (Clean)
           Palette: Stark White, Jet Black, Cold Pine Green
           ========================================= */
        [data-theme="nordic"] {
            --bg: #FFFFFF;
            --text: #000000;
            --accent: #2F4F4F;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        [data-theme="nordic"] header {
            text-align: left;
            border-bottom: 1px solid #000;
            padding-bottom: 2rem;
            max-width: 100%;
        }

        [data-theme="nordic"] .grid {
            gap: 4rem 2rem;
        }

        [data-theme="nordic"] .card {
            background: transparent;
            box-shadow: none;
            border-radius: 0;
        }

        [data-theme="nordic"] .card-image {
            height: 380px;
            filter: grayscale(100%);
            transition: all 0.5s ease;
            margin-bottom: 1.5rem;
        }

        [data-theme="nordic"] .card:hover .card-image {
            filter: grayscale(0%);
        }

        [data-theme="nordic"] h1 {
            font-weight: 300;
            font-size: 3rem;
            letter-spacing: -0.05em;
            color: #000;
        }

        [data-theme="nordic"] .tag {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.65rem;
            border: 1px solid #ddd;
            padding: 0.3rem 0.6rem;
            background: transparent;
            color: #000;
            text-transform: uppercase;
        }

        [data-theme="nordic"] .tag:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        [data-theme="nordic"] .back-btn {
            border-bottom: 1px solid #000;
            padding: 0.2rem 0;
            width: auto;
            display: inline-block;
        }

        [data-theme="nordic"] .detail-hero {
            border-radius: 0;
            filter: grayscale(100%);
        }

        [data-theme="nordic"] .info-box {
            background: transparent;
            border: 1px solid #eee;
            border-radius: 0;
        }

        [data-theme="nordic"] .info-row {
            border-color: #eee;
        }

        /* =========================================
           5. NIGHT AT THE TEMPLE (Premium/Dark)
           Palette: Indigo, Midnight, Amber, Silver
           ========================================= */
        [data-theme="temple"] {
            --bg: #1A1A2E;
            --text: #E0E0E0;
            --gold: #FFD700;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 80% 20%, #252850 0%, #1A1A2E 70%);
        }

        [data-theme="temple"] .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        [data-theme="temple"] h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding-bottom: 2rem;
            display: inline-block;
        }

        [data-theme="temple"] .tag {
            color: var(--gold);
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: transparent;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.1);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
        }

        [data-theme="temple"] .card-image {
            opacity: 0.85;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        [data-theme="temple"] .back-btn {
            color: var(--gold);
            border: 1px solid var(--gold);
            background: rgba(255, 215, 0, 0.1);
            border-radius: 4px;
        }

        [data-theme="temple"] .detail-hero {
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        [data-theme="temple"] .info-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        [data-theme="temple"] .info-row {
            border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="temple"] .detail-title {
            font-family: 'Cinzel', serif;
            color: #FFF;
        }
    </style>
</head>

            style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;">

                desc: "Grower-owned cooperative bringing native hazelnuts back to the Midwestern landscape.",
                longDesc: "The American Hazelnut Company is a collective of growers working to reintroduce hazelnuts to the Midwest. We produce gluten-free hazelnut flour, roasted nuts, and oil, promoting perennial agriculture that protects our soil and water.",
                image: "https://images.unsplash.com/photo-1505575967455-40e256f73376?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
                tags: ["Co-op", "Sustainable", "Agriculture"],
                address: "Food Enterprise Center, Viroqua",
                phone: "(608) 555-0199",
                hours: "Online & By Appointment"
            },
            {
                id: 6,
                name: "217 on Main",
                desc: "Charming accommodations right in the heart of downtown Viroqua.",
                longDesc: "Experience Viroqua like a local. 217 on Main offers boutique suites with modern amenities and vintage charm. Validated as one of the best places to stay in the Driftless, we are steps away from the best dining and shopping.",
                image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
                tags: ["Lodging", "Downtown", "Boutique"],
                address: "217 N Main St, Viroqua, WI",
                phone: "(608) 306-3171",
                hours: "Check-in: 3pm, Checkout: 11am"
            }
        ];

        function renderGrid() {
            const grid = document.getElementById('listingGrid');
            grid.innerHTML = businesses.map(biz => `
                <article class="card" onclick="openDetail(${biz.id})">
                    <div class="card-image" style="background-image: url('${biz.image}')"></div>
                    <div class="card-content">
                        <div class="tags">
                            ${biz.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <h2 class="card-title">${biz.name}</h2>
                        <p>${biz.desc}</p>
                    </div>
                </article>
            `).join('');
        }

        function openDetail(id) {
            const biz = businesses.find(b => b.id === id);
            if (!biz) return;

            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="detail-hero" style="background-image: url('${biz.image}')"></div>
                
                <header class="detail-header" style="text-align: left; margin: 0;">
                    <div class="tags" style="margin-bottom: 1rem;">
                        ${biz.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <h1 class="detail-title" style="font-size: 3rem; line-height: 1.1; border: none; padding: 0;">${biz.name}</h1>
                </header>

                <div class="detail-grid">
                    <div class="main-info">
                        <p style="font-size: 1.2rem; line-height: 1.6; opacity: 0.9;">${biz.longDesc}</p>
                    </div>
                    <aside class="sidebar">
                        <div class="info-box">
                            <div class="info-row">
                                <div class="info-label">Address</div>
                                <div class="info-val">${biz.address}</div>
                            </div>
                            <div class="info-row">
                                <div class="info-label">Phone</div>
                                <div class="info-val">${biz.phone}</div>
                            </div>
                            <div class="info-row">
                                <div class="info-label">Hours</div>
                                <div class="info-val">${biz.hours}</div>
                            </div>
                             <div class="info-row">
                                <button style="margin-top: 1rem; width: 100%; padding: 1rem; background: var(--text); color: var(--bg); font-weight: bold; border-radius: 4px; cursor: pointer;">Visit Website</button>
                            </div>
                        </div>
                    </aside>
                </div>
            `;

            document.getElementById('gridView').classList.remove('active');
            setTimeout(() => {
                document.getElementById('detailView').classList.add('active');
                window.scrollTo(0, 0);
            }, 300);
        }

        function closeDetail() {
            document.getElementById('detailView').classList.remove('active');
            setTimeout(() => {
                document.getElementById('gridView').classList.add('active');
            }, 300);
        }

        function switchTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            const title = document.getElementById('pageTitle');
            const sub = document.getElementById('pageSubtitle');

            if (theme === 'vintage') {
                title.textContent = "The Viroqua Guide.";
                sub.textContent = "Est. 2026";
            } else if (theme === 'boho') {
                title.innerHTML = "VIROQUA<br>GUIDE";
                sub.textContent = "Organic. Local. Wild.";
            } else if (theme === 'driftless') {
                title.textContent = "Viroqua Business Guide";
                sub.textContent = "Discover the magic of the Driftless region.";
            } else if (theme === 'nordic') {
                title.textContent = "Viroqua.";
                sub.textContent = "A curated directory.";
            } else {
                title.textContent = "Viroqua Business Guide";
            }
        }

        // Init
        renderGrid();
    </script>
</body>

</html>
